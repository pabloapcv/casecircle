name: Keep-alive ping

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping casecircle.us (warm origin + health)
        run: |
          ping_url() {
            curl -fsS -o /dev/null -w '%{http_code} %{time_total}s' --max-time 90 "$1"
          }
          for url in \
            "https://casecircle.us/health.json" \
            "https://casecircle.us/" \
            "https://casecircle.us/es/" \
            "https://casecircle.us/health.json"
          do
            out="$(ping_url "$url")" || true
            echo "$url → ${out:-failed}"
            code="${out%% *}"
            if [ "$code" != "200" ]; then
              exit 1
            fi
          done