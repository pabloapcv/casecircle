# CaseCircle web app on Render: one Python web service (stdlib only). With SUPABASE_URL set, accounts and posts live
# in Supabase and the disk below is not needed; without it they live in SQLite on the persistent disk.
# Persistent disks need a paid instance type and keep the service at a single instance (no zero-downtime deploys).
services:
  - type: web
    name: casecircle
    runtime: python
    plan: starter
    rootDir: web
    buildCommand: pip install -r requirements.txt
    startCommand: python3 serve.py
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: casecircle-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CASECIRCLE_DB_PATH
        value: /var/data/casecircle.db
      - key: CASECIRCLE_TRUST_PROXY
        value: "1"
      - key: CASECIRCLE_COOKIE_SECURE
        value: "1"
      - key: SUPABASE_URL              # https://<project-ref>.supabase.co — accounts + data live in Supabase
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY  # sb_publishable_… (public key; never a secret/service-role key)
        sync: false
      - key: CASECIRCLE_ADMIN_EMAILS   # SQLite mode only; with Supabase, admin is accounts.is_admin
        sync: false
      - key: CASECIRCLE_PUBLIC_ORIGIN   # e.g. https://casecircle.app — builds the links in emails
        sync: false
      - key: CASECIRCLE_EMAIL_PROVIDER
        value: resend
      - key: CASECIRCLE_EMAIL_FROM      # e.g. CaseCircle <hello@mail.casecircle.app> (domain verified in Resend)
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CASECIRCLE_LLM_API_KEY
        sync: false
      - key: CASECIRCLE_LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: CASECIRCLE_LLM_MODEL
        value: gpt-4o-mini
