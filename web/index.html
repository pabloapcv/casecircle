<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="color-scheme" content="light">
  <meta name="description" content="The calm, bilingual companion for the USCIS wait. Check the wait, gather papers on your device, prepare for interviews, and avoid scams. Not affiliated with USCIS.">
  <title>CaseCircle — the calm, bilingual companion for the USCIS wait</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%231F7A6E' stroke-width='3.5'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%231F7A6E'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css?v=62d6a2e">
</head>
<body>
  <div id="app">Loading CaseCircle…</div>
  <script type="module">
    import("./app.js").catch((error) => {
      const root = document.getElementById("app");
      if (!root) return;
      const pre = document.createElement("pre");
      pre.className = "page";
      pre.textContent = error && (error.stack || error.message) || String(error);
      root.replaceChildren(pre);
    });
  </script>
</body>
</html>
